name: CI - test, scan, SBOM, sign
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  build-and-secure:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local image for scanning
        run: docker build -t healthqueue:ci .
      - name: Scan image; block HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: healthqueue:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
      - name: Set up Syft
        uses: anchore/sbom-action/download-syft@v0.20.2
      - name: Generate CycloneDX SBOM
        run: syft healthqueue:ci -o cyclonedx-json=sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Set up Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3.9.2
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push commit-tagged image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE:${GITHUB_SHA}" .
          docker push "$IMAGE:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Sign pushed image digest with keyless Cosign
        if: github.event_name == 'push'
        env:
          COSIGN_YES: 'true'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign "$IMAGE@$DIGEST"
