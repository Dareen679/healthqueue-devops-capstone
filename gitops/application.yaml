apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthqueue
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dareen679/healthqueue-devops-capstone.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: healthqueue
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
